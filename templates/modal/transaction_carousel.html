<div id="carousel-overlay"
     style="display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.6);backdrop-filter:blur(2px)"
     class="flex items-center justify-center p-4">

  <div id="carousel-card"
       class="modal-sheet card w-full max-w-lg relative"
       onclick="event.stopPropagation()">

    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-semibold text-gray-800 dark:text-white">
        <i class="fas fa-tasks text-amber-500 mr-2"></i>
        À compléter
        <span id="carousel-counter" class="text-sm font-normal text-gray-500 ml-1"></span>
      </h2>
      <button id="carousel-close"
              class="w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-700 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-slate-700 border-none bg-transparent cursor-pointer">
        <i class="fas fa-xmark"></i>
      </button>
    </div>

    <div id="carousel-body">
      <div class="bg-gray-50 dark:bg-slate-700/50 rounded-xl p-4 mb-4">
        <p id="c-date" class="text-xs text-gray-400 mb-1"></p>
        <p id="c-operation" class="font-semibold text-gray-900 dark:text-white leading-tight"></p>
        <p id="c-amount" class="text-lg font-bold mt-1"></p>
        <p id="c-parse-note" class="text-xs text-amber-600 dark:text-amber-400 mt-1" style="display:none"></p>
      </div>

      <div class="space-y-3">
        <div id="c-operation-row" style="display:none">
          <label class="label">Opération *</label>
          <input id="c-op-input" type="text" class="input" placeholder="Description de l'opération">
        </div>
        <div id="c-amount-row" style="display:none">
          <label class="label">Montant *</label>
          <input id="c-amt-input" type="number" step="0.01" class="input">
        </div>
        <div>
          <label class="label">Catégorie *</label>
          <select id="c-category" class="input">
            <option value="">— Choisir —</option>
            {% for c in categories | default(value=[]) %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          {% set share_prefix = "c" %}
          {% include "modal/_shares_field.html" %}
        </div>

        <div>
          <label class="label">Notes <span class="text-gray-400 font-normal">(optionnel)</span></label>
          <input id="c-notes" type="text" class="input" placeholder="Note libre…">
        </div>
        <div id="c-save-status" class="text-xs h-4 text-gray-400"></div>
      </div>
    </div>

    <div id="carousel-footer" class="flex flex-wrap items-center justify-between gap-2 mt-5 pt-4 border-t border-gray-200 dark:border-slate-700">
      <div class="flex gap-2">
        <button id="c-cancel" class="btn-secondary" style="padding:0.5rem 1rem;font-size:0.875rem">
          Annuler
        </button>
        <button id="c-prev" class="btn-secondary" style="padding:0.5rem 1rem;font-size:0.875rem">
          <i class="fas fa-chevron-left mr-1"></i> Précédent
        </button>
      </div>
      <div class="flex gap-2">
        <button id="c-save" class="btn-secondary" style="padding:0.5rem 1rem;font-size:0.875rem">
          <i class="fas fa-floppy-disk mr-1"></i> Enregistrer
        </button>
        <button id="c-finish" class="btn-success" style="display:none;padding:0.5rem 1rem;font-size:0.875rem">
          <i class="fas fa-check mr-1"></i> Terminer
        </button>
        <button id="c-next" class="btn-primary" style="padding:0.5rem 1rem;font-size:0.875rem">
          Suivant <i class="fas fa-chevron-right ml-1"></i>
        </button>
      </div>
    </div>
  </div>
</div>
