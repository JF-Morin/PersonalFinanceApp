<div id="del-modal" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.55);backdrop-filter:blur(3px)"
     class="flex items-center justify-center p-4">
  <div class="modal-sheet card max-w-xl w-full">
    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
      <i class="fas fa-triangle-exclamation text-red-500"></i>
      Supprimer la transaction ?
    </h2>
    <div class="rounded-xl bg-gray-50 dark:bg-slate-700/50 border border-gray-200 dark:border-slate-600 p-4 mb-4 space-y-2.5">
      <div class="flex items-start gap-2">
        <i class="fas fa-file-lines text-gray-400 mt-0.5 w-4 flex-shrink-0 text-xs"></i>
        <span id="del-modal-op" class="text-sm font-medium text-gray-900 dark:text-gray-100 leading-snug"></span>
      </div>
      <div class="flex flex-wrap gap-x-6 gap-y-1.5 text-sm text-gray-500 dark:text-gray-400">
        <span class="flex items-center gap-1.5">
          <i class="fas fa-calendar-day w-3.5 text-xs"></i>
          <span id="del-modal-date"></span>
        </span>
        <span class="flex items-center gap-1.5">
          <i class="fas fa-coins w-3.5 text-xs"></i>
          <span id="del-modal-amount"></span>
        </span>
        <span id="del-modal-cat-row" class="flex items-center gap-1.5">
          <i class="fas fa-tag w-3.5 text-xs"></i>
          <span id="del-modal-cat"></span>
        </span>
        <span class="flex items-center gap-1.5">
          <i class="fas fa-user w-3.5 text-xs"></i>
          <span id="del-modal-owner"></span>
        </span>
      </div>
    </div>
    <p class="text-xs text-red-500 dark:text-red-400 mb-5 flex items-center gap-1.5">
      <i class="fas fa-triangle-exclamation"></i> Cette action est irréversible.
    </p>
    <div class="flex gap-2 justify-end">
      <button id="del-cancel" class="btn-secondary">Annuler</button>
      <button id="del-confirm"
              class="btn-danger"
              hx-swap="outerHTML delete">
        <i class="fas fa-trash mr-1"></i> Supprimer
      </button>
    </div>
  </div>
</div>

<script>
document.getElementById('del-confirm').addEventListener('htmx:afterRequest', function(e) {
  document.getElementById('del-modal').style.display = 'none';
  if (e.detail.successful) {
    window.showTransactionToast && showTransactionToast('Transaction supprimée.');
    window.syncPendingAfterSave && syncPendingAfterSave();
  } else {
    window.showTransactionToast && showTransactionToast('Erreur : ' + (e.detail.xhr.responseText || 'suppression échouée.'), true);
  }
});
</script>
