<!DOCTYPE html>
<html lang="fr" class="{% if is_dark %}dark{% endif %} h-full">
<head>
  <meta charset="UTF-8">
  <title>Connexion — Finance Perso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-slate-900 flex items-center justify-center h-full">

<div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-10 w-full max-w-md">
  <div class="text-center mb-8">
    <i class="fas fa-wallet text-5xl text-indigo-600 mb-3"></i>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Finance Perso</h1>
    <p class="text-gray-500 dark:text-gray-400 mt-1 text-sm">Sélectionnez votre profil pour continuer</p>
  </div>

  {% if users %}
  <div class="space-y-3">
    {% for user in users %}
    <form action="/login" method="POST">
      <input type="hidden" name="user_id" value="{{ user.id }}">
      <button type="submit"
        class="w-full flex items-center gap-4 px-5 py-4 rounded-xl border-2 border-gray-200 dark:border-slate-600 hover:border-indigo-500 hover:bg-indigo-50 dark:hover:bg-slate-700 transition-all text-left">
        <div class="w-10 h-10 rounded-full bg-indigo-100 dark:bg-indigo-900 flex items-center justify-center text-indigo-600 font-bold text-lg">
          {{ user.name | slice(end=1) | upper }}
        </div>
        <div>
          <div class="font-semibold text-gray-900 dark:text-white">
            {{ user.name }}{% if user.last_name %} {{ user.last_name }}{% endif %}
          </div>
        </div>
        <i class="fas fa-chevron-right ml-auto text-gray-400"></i>
      </button>
    </form>
    {% endfor %}
  </div>
  {% else %}
  <div class="text-center py-8 text-gray-500 dark:text-gray-400">
    <i class="fas fa-users text-4xl mb-3 text-gray-300"></i>
    <p>Aucun utilisateur trouvé.</p>
    <p class="text-sm mt-2">Créez un utilisateur dans <a href="/settings" class="text-indigo-600 hover:underline">Paramètres</a>.</p>
  </div>
  {% endif %}
</div>

</body>
</html>
