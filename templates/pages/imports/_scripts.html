<script>
(function () {
  var deleteModal  = document.getElementById('delete-modal');
  var reparseModal = document.getElementById('reparse-modal');
  var toast        = document.getElementById('toast');
  var toastIcon    = document.getElementById('toast-icon');
  var toastMsg     = document.getElementById('toast-msg');

  function showToast(msg, success) {
    toast.style.background = success ? '#059669' : '#dc2626';
    toastIcon.className = 'fas ' + (success ? 'fa-check-circle' : 'fa-circle-xmark');
    toastMsg.textContent = msg;
    toast.style.display = 'flex';
    setTimeout(function () { toast.style.display = 'none'; }, 5000);
  }
  window.showFileToast = showToast;

  // HX-Trigger toast from delete/reparse handlers
  document.body.addEventListener('showFileToast', function(e) {
    showToast(e.detail.msg, e.detail.ok !== false);
    var tbody = document.getElementById('files-tbody');
    if (tbody && tbody.querySelectorAll('tr[id]').length === 0) {
      var emptyRow = document.createElement('tr');
      emptyRow.innerHTML =
        '<td colspan="6" class="text-center py-12 text-gray-400">' +
          '<i class="fas fa-inbox text-4xl mb-3 block"></i>Aucun fichier importé.' +
        '</td>';
      tbody.appendChild(emptyRow);
    }
  });

  // ── Delete ──────────────────────────────────────────────────────────────────
  document.querySelectorAll('.delete-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id  = btn.dataset.id;
      var url = '/imported-files/' + id + '/delete';
      document.getElementById('del-modal-filename').textContent = btn.dataset.filename;
      document.getElementById('del-modal-row-count').textContent = btn.dataset.rowCount;
      var withTransactions   = document.getElementById('btn-delete-with-transactions');
      var fileOnly = document.getElementById('btn-delete-file-only');
      withTransactions.setAttribute('hx-post',   url + '?with_transactions=1');
      withTransactions.setAttribute('hx-target', '#file-row-' + id);
      fileOnly.setAttribute('hx-post',   url + '?with_transactions=0');
      fileOnly.setAttribute('hx-target', '#file-row-' + id);
      htmx.process(withTransactions);
      htmx.process(fileOnly);
      deleteModal.style.display = 'flex';
    });
  });

  // ── Reparse ─────────────────────────────────────────────────────────────────
  document.querySelectorAll('.reparse-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.getElementById('reparse-modal-filename').textContent = btn.dataset.filename;
      var confirmBtn = document.getElementById('btn-confirm-reparse');
      confirmBtn.setAttribute('hx-post', '/imported-files/' + btn.dataset.id + '/reparse');
      htmx.process(confirmBtn);
      reparseModal.style.display = 'flex';
    });
  });
})();
</script>

<script>
(function fitTableHeight() {
  var wrapper = document.getElementById('imports-table-wrapper');
  if (!wrapper) return;
  function fit() {
    var top = wrapper.getBoundingClientRect().top;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var bottomPad = window.innerWidth < 1024 ? 4 * rem + 8 : rem;
    var h = window.innerHeight - top - bottomPad;
    wrapper.style.height = Math.max(200, h) + 'px';
  }
  fit();
  window.addEventListener('resize', fit);
  document.addEventListener('htmx:afterSettle', fit);
})();

// Sort for imports table
var _impSort = { col: null, dir: 0 };
function impSort(col, el) {
  var tbody = document.getElementById('files-tbody');
  var rows  = Array.from(tbody.querySelectorAll('tr[data-filename]'));
  _impSort.dir = (_impSort.col === col && _impSort.dir === 1) ? -1 : 1;
  _impSort.col = col;
  document.querySelectorAll('#files-thead .sort-icon').forEach(function(i) {
    i.className = 'fas fa-sort text-gray-400 text-xs sort-icon';
  });
  var icon = el.querySelector('.sort-icon');
  if (icon) icon.className = 'fas ' + (_impSort.dir === 1 ? 'fa-sort-up' : 'fa-sort-down') + ' text-indigo-500 text-xs sort-icon';
  rows.sort(function(a, b) {
    var va, vb, d = _impSort.dir;
    if (col === 'filename') { va = a.dataset.filename || ''; vb = b.dataset.filename || ''; return d * va.localeCompare(vb, 'fr'); }
    if (col === 'bank')     { va = a.dataset.bank     || ''; vb = b.dataset.bank     || ''; return d * va.localeCompare(vb, 'fr'); }
    if (col === 'date')     { va = a.dataset.date     || ''; vb = b.dataset.date     || ''; return d * va.localeCompare(vb); }
    if (col === 'transactionCount')  { va = parseInt(a.dataset.transactionCount) || 0; vb = parseInt(b.dataset.transactionCount) || 0; return d * (va - vb); }
    if (col === 'importer') { va = a.dataset.importer || ''; vb = b.dataset.importer || ''; return d * va.localeCompare(vb, 'fr'); }
    return 0;
  });
  rows.forEach(function(r) { tbody.appendChild(r); });
}

window.__appChangeHandler = function(evt) {
  if (evt.actor_id === CURRENT_USER_ID) return;
  if (evt.kind !== 'imports') return;
  var importModal = document.getElementById('import-modal');
  var modalOpen = importModal && importModal.style.display !== 'none';
  if (!modalOpen) {
    window.location.reload();
  }
};
</script>
