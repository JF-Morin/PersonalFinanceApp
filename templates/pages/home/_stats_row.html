<div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
  <div class="card flex items-center gap-3 p-4">
    <div class="w-12 h-12 rounded-xl bg-primary-100 dark:bg-primary-900/40 flex items-center justify-center text-primary-600 flex-shrink-0">
      <i class="fas fa-receipt text-xl"></i>
    </div>
    <div>
      <div class="text-xl font-bold" id="stat-total-transactions">{{ total_transactions }}</div>
      <div class="text-xs text-gray-500 dark:text-gray-400">Transactions</div>
    </div>
  </div>
  <div class="card flex items-center gap-3 p-4">
    <div class="w-12 h-12 rounded-xl bg-amber-100 dark:bg-amber-900/40 flex items-center justify-center text-amber-600 flex-shrink-0">
      <i class="fas fa-clock text-xl"></i>
    </div>
    <div>
      <div class="text-xl font-bold" id="stat-pending-count">{{ pending_count }}</div>
      <div class="text-xs text-gray-500 dark:text-gray-400">À compléter</div>
    </div>
  </div>
  <div class="card flex items-center gap-3 p-4">
    <div class="w-12 h-12 rounded-xl bg-green-100 dark:bg-green-900/40 flex items-center justify-center text-green-600 flex-shrink-0">
      <i class="fas fa-file-pdf text-xl"></i>
    </div>
    <div>
      <div class="text-xl font-bold" id="stat-total-files">{{ total_files }}</div>
      <div class="text-xs text-gray-500 dark:text-gray-400">Fichiers importés</div>
    </div>
  </div>
  <a href="/imported-files"
     class="card flex items-center gap-3 p-4 no-underline
            hover:border-primary-400 dark:hover:border-primary-500 hover:shadow-md transition-all cursor-pointer">
    <div class="w-12 h-12 rounded-xl bg-primary-600 flex items-center justify-center text-white flex-shrink-0">
      <i class="fas fa-file-upload text-xl"></i>
    </div>
    <div>
      <div class="text-xl font-bold text-primary-600 dark:text-primary-400">Importer</div>
      <div class="text-xs text-gray-500 dark:text-gray-400">Relevé PDF</div>
    </div>
  </a>
</div>
