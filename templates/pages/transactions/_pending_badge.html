<button id="btn-open-carousel"
        class="btn-warning"
        hx-get="/transactions/pending-badge"
        hx-trigger="refresh, sse:transactions"
        hx-swap="outerHTML"
        {% if pending_count == 0 %}disabled title="Toutes les transactions sont complètes"{% else %}title="À compléter"{% endif %}>
  {% if pending_count > 0 %}
  <i class="fas fa-tasks mr-1"></i> <span class="btn-label">À compléter</span> ({{ pending_count }})
  {% else %}
  <i class="fas fa-check-circle mr-1"></i> <span class="btn-label">À compléter</span> (0)
  {% endif %}
</button>
