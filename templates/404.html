<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — Finance Perso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=jetbrains-mono:400,500,600,700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  </style>
</head>
<body class="h-full bg-gray-50 flex items-center justify-center p-6">
  <div class="text-center max-w-md">
    <p class="text-8xl font-bold text-gray-200 select-none mb-2">404</p>
    <h1 class="text-2xl font-semibold text-gray-800 mb-2">Page introuvable</h1>
    <p class="text-gray-500 text-sm mb-8">
      La page que vous cherchez n'existe pas ou a été déplacée.
    </p>
    <div class="flex items-center justify-center gap-3">
      <a href="/"
         class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium
                bg-indigo-600 text-white hover:bg-indigo-700 transition-colors">
        <i class="fas fa-house"></i> Accueil
      </a>
      <a href="javascript:history.back()"
         class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium
                border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors">
        <i class="fas fa-arrow-left"></i> Retour
      </a>
    </div>
  </div>
</body>
</html>
