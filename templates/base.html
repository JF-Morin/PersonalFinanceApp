<!DOCTYPE html>
<html lang="fr" class="{% if is_dark %}dark{% endif %} h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Finance Perso{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#4f46e5', dark: '#4338ca' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    .nav-link { @apply flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors; }
    .nav-link:hover { @apply bg-indigo-50 text-indigo-700 dark:bg-slate-700 dark:text-indigo-300; }
    .nav-link.active { @apply bg-indigo-100 text-indigo-700 dark:bg-slate-600 dark:text-indigo-300; }
    .card { @apply bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-200 dark:border-slate-700 p-5; }
    .btn-primary { @apply bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors; }
    .btn-secondary { @apply bg-gray-100 hover:bg-gray-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-gray-700 dark:text-gray-200 px-4 py-2 rounded-lg text-sm font-medium transition-colors; }
    .input { @apply w-full border border-gray-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm bg-white dark:bg-slate-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500; }
    .label { @apply block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1; }
    .table-header { @apply px-4 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider; }
    .table-cell { @apply px-4 py-3 text-sm text-gray-800 dark:text-gray-200; }
    /* HTMX loading indicator */
    .htmx-indicator { opacity: 0; transition: opacity 150ms ease-in; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
  </style>
  {% block head %}{% endblock %}
</head>

<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 h-full">

<!-- Global HTMX loading bar -->
<div id="htmx-loader"
     class="htmx-indicator fixed top-0 left-0 w-full h-0.5 bg-indigo-500 z-50"></div>

<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 flex-shrink-0 bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 flex flex-col">
    <!-- Logo -->
    <div class="px-5 py-4 border-b border-gray-200 dark:border-slate-700">
      <a href="/" class="flex items-center gap-2 text-indigo-600 font-bold text-lg">
        <i class="fas fa-wallet"></i> Finance Perso
      </a>
    </div>

    <!-- Current user -->
    {% if current_user %}
    <div class="px-5 py-3 border-b border-gray-200 dark:border-slate-700 text-sm text-gray-600 dark:text-gray-300">
      <i class="fas fa-user-circle mr-1 text-indigo-500"></i>
      {{ current_user.name }}{% if current_user.last_name %} {{ current_user.last_name }}{% endif %}
    </div>
    {% endif %}

    <!-- Navigation — hx-boost makes all links HTMX-driven (no full reload) -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto"
         hx-boost="true" hx-indicator="#htmx-loader">
      <a href="/"                        class="nav-link"><i class="fas fa-home w-4"></i> Accueil</a>
      <a href="/dashboard"               class="nav-link"><i class="fas fa-chart-bar w-4"></i> Dashboard</a>
      <a href="/transactions"            class="nav-link"><i class="fas fa-list w-4"></i> Transactions</a>
      <a href="/incomplete-transactions" class="nav-link"><i class="fas fa-clock w-4"></i> À compléter</a>
      <a href="/upload"                  class="nav-link"><i class="fas fa-file-upload w-4"></i> Importer</a>
      <a href="/imported-files"          class="nav-link"><i class="fas fa-file-pdf w-4"></i> Fichiers importés</a>
      <a href="/settings"                class="nav-link"><i class="fas fa-cog w-4"></i> Paramètres</a>
    </nav>

    <!-- Logout -->
    <div class="px-3 py-4 border-t border-gray-200 dark:border-slate-700">
      <form action="/logout" method="POST">
        <button type="submit" class="nav-link w-full text-gray-500 dark:text-gray-400 hover:text-red-500">
          <i class="fas fa-right-from-bracket w-4"></i> Changer d'utilisateur
        </button>
      </form>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-y-auto">
    <div class="p-6 max-w-7xl mx-auto">
      {% block content %}{% endblock %}
    </div>
  </main>

</div>
</body>
</html>
