services:
  app:
    build: .
    image: personal-finance-app:latest
    container_name: personal-finance-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: sqlite:/app/data/finance.db
      STORAGE_PATH: /app/storage
      LOG_PATH: /app/logs
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      # Local time zone (today's date, current year, backup names). Without it: UTC.
      TZ: ${TZ:-America/Toronto}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-this-in-production-32bytes!!}
      # Override log verbosity if needed: RUST_LOG=personal_finance_app=trace,tower_http=debug
      RUST_LOG: ${RUST_LOG:-personal_finance_app=debug,tower_http=info}
      # Database backups (see src/backup.rs): at startup, then every BACKUP_INTERVAL_HOURS.
      # Tip: keep them on another disk than the database — e.g. add a volume
      #   - /mnt/user/backups/personal-finance:/app/backups
      # and set BACKUP_DIR=/app/backups in .env.
      BACKUP_DIR: ${BACKUP_DIR:-/app/data/db-backup}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      # SQLite database — persisted locally
      - ./data:/app/data
      # PDF statement storage — change the left side to your SMB mount path
      # e.g. /mnt/user/PersonalFinanceApp:/app/storage
      - ./storage:/app/storage
      # Log files — one per day, named app.log.YYYY-MM-DD
      - ./logs:/app/logs
      # Templates — mount for live edits without a full rebuild
      - ./templates:/app/templates
